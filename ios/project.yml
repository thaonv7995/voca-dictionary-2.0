name: Voca
options:
  bundleIdPrefix: site.thaonv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.3.1"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Voca:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Voca
      - path: Shared
    dependencies:
      - target: VocaWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca
        PRODUCT_NAME: Voca
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Device builds: automatic signing — open in Xcode and pick your Team (Signing & Capabilities).
        # Headless simulator builds pass CODE_SIGNING_ALLOWED=NO on the command line instead.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Voca/Voca.entitlements
    info:
      path: Voca/Info.plist
      properties:
        CFBundleDisplayName: Voca
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Voca dùng camera để quét văn bản và tạo thẻ từ vựng."
        NSPhotoLibraryUsageDescription: "Voca đọc ảnh bạn chọn để nhận diện từ và tạo thẻ."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - voca
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - NotoSerifSC-Regular.otf
          - NotoSerifSC-Bold.otf
        # Allow cleartext HTTP to the local dev backend (http://localhost:22052).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  VocaWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VocaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca.widget
        PRODUCT_NAME: VocaWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VocaWidget/VocaWidget.entitlements
    info:
      path: VocaWidget/Info.plist
      properties:
        CFBundleDisplayName: Từ vựng
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VocaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VocaUITests
    dependencies:
      - target: Voca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca.uitests
        TEST_TARGET_NAME: Voca
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  VocaMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: VocaMac
      - path: Shared/WidgetSharedStore.swift
      # Shared product infrastructure extracted from the iOS application.
      # Keep this list explicit so platform-specific SwiftUI, WidgetKit,
      # camera, and photo-import code cannot leak into the macOS target.
      - path: Voca/Core/Auth
      - path: Voca/Core/Cache/AppCache.swift
      - path: Voca/Core/Models/Card.swift
      - path: Voca/Core/Models/StudyModels.swift
      - path: Voca/Core/Models/User.swift
      - path: Voca/Core/Networking
      - path: Voca/Core/Services/AssistantService.swift
      - path: Voca/Core/Services/ClientPrompts.swift
      - path: Voca/Core/Services/CardsService.swift
      - path: Voca/Core/Services/StudyService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca.macos
        PRODUCT_NAME: Voca
        PRODUCT_MODULE_NAME: VocaMac
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        OTHER_LDFLAGS: "-lsqlite3"
    info:
      path: VocaMac/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Voca
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - voca
        NSServices:
          - NSMenuItem:
              default: Look Up in Voca
            NSMessage: lookUpInVoca
            NSPortName: Voca
            NSSendTypes:
              - NSStringPboardType
          - NSMenuItem:
              default: Add to Voca
            NSMessage: addToVoca
            NSPortName: Voca
            NSSendTypes:
              - NSStringPboardType
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  VocaMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: VocaMacTests
    dependencies:
      - target: VocaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca.macos.tests
        PRODUCT_NAME: VocaMacTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voca.app/Contents/MacOS/Voca"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Voca:
    build:
      targets:
        Voca: all
        VocaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VocaUITests

  VocaMac:
    build:
      targets:
        VocaMac: all
        VocaMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VocaMacTests
    archive:
      config: Release
