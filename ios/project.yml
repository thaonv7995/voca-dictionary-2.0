name: Voca
options:
  bundleIdPrefix: site.thaonv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Voca:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Voca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca
        PRODUCT_NAME: Voca
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Device builds: automatic signing — open in Xcode and pick your Team (Signing & Capabilities).
        # Headless simulator builds pass CODE_SIGNING_ALLOWED=NO on the command line instead.
        CODE_SIGN_STYLE: Automatic
    info:
      path: Voca/Info.plist
      properties:
        CFBundleDisplayName: Voca
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Voca dùng camera để quét văn bản và tạo thẻ từ vựng."
        NSPhotoLibraryUsageDescription: "Voca đọc ảnh bạn chọn để nhận diện từ và tạo thẻ."
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow cleartext HTTP to the local dev backend (http://localhost:22052).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  VocaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VocaUITests
    dependencies:
      - target: Voca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.thaonv.voca.uitests
        TEST_TARGET_NAME: Voca
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Voca:
    build:
      targets:
        Voca: all
        VocaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VocaUITests
